        <h1>Breathing Walls</h1>
        <h2>건축의 표면 위에 깃든 반투명한 순간들</h2>
        <p>목재 프레임과 유리창이라는 건축적 경계 위에 반투명 이미지를 겹쳐 설치한 작업으로, 도시의 건물과 유기적으로 흩뿌려진 입자 형상이 하나의 표면 안에서 공존한다. 실내외 창문틀에 자연스럽게 놓인 작품은 주변 공간의 빛과 반사, 질감을 그대로 흡수하며 매 순간 다르게 읽히는 살아있는 벽으로 기능한다.</p>
